[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "starling-memory"
version = "0.0.1"
description = "Starling Memory — agent memory with multi-subject social mind"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.12", "jsonschema>=4.26"]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "httpx2>=0.28",
]

[tool.scikit-build]
cmake.version = ">=3.27"
wheel.packages = ["python/starling"]
cmake.args = ["-DSTARLING_BUILD_PYTHON=ON"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra -v --strict-markers"
# pytest 9.0.3 实测:写在 addopts 里的 --strict-markers 对未知 marker 只告警不报错,
# ini 键 strict_markers 才会报错(pytest 8 无此键,会提示未知配置项但不影响运行)。
strict_markers = true
